name: Actualizar tarjetas de actividad

on:
  schedule:
    # Lunes y jueves a las 06:00 UTC (01:00 en Bogotá).
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-stats.mjs'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar SVG
        env:
          # STATS_TOKEN es un PAT con `read:user`; sin él las tarjetas se
          # generan igual, pero omiten la métrica de trabajo en repos privados.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Publicar cambios
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "Sin cambios en las tarjetas."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore(stats): actualizar tarjetas de actividad"
          git push
