name: Actualizar tarjetas de actividad

on:
  schedule:
    # Cada 3 horas. Es lo más cerca del tiempo real que llega un README: las
    # imágenes son archivos del propio repositorio, así que solo se refrescan
    # cuando hay un commit. El minuto 17 evita el pico de crons en punto, donde
    # GitHub encola y retrasa los runs.
    - cron: '17 */3 * * *'
  workflow_dispatch:
  # Permite forzar el refresco desde fuera:
  #   gh api repos/Owito/Owito/dispatches -f event_type=refresh-stats
  repository_dispatch:
    types: [refresh-stats]
  push:
    branches: [main]
    paths:
      - 'scripts/generate-stats.mjs'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generar SVG
        env:
          # STATS_TOKEN es un PAT clásico con `read:user` + `repo`. Sin él las
          # tarjetas se generan igual, pero el GITHUB_TOKEN de Actions solo ve
          # lo público: omite la métrica de trabajo privado y cuenta únicamente
          # los repositorios públicos.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Publicar cambios
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "Las cifras no se movieron: no se publica commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore(stats): actualizar tarjetas de actividad"
          git push
